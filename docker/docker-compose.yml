# Biblebot - Agent API 服务
# Qdrant 向量数据库 + Biblebot API 服务（OpenAI 兼容 + RAG）
# Agent Runtime: Qoder CLI（通过 QODER_PERSONAL_ACCESS_TOKEN 认证，无需预装）

version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: biblebot-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - biblebot-net

  biblebot:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
      args:
        # 代理配置（可选，国内环境可能需要）
        - HTTP_PROXY=${HTTP_PROXY:-}
        - HTTPS_PROXY=${HTTPS_PROXY:-}
        - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1,qdrant}
    container_name: biblebot-server
    ports:
      - "8000:8000"
    volumes:
      # 知识库目录（只读）
      - ../data/canonical_md:/app/data/canonical_md:ro
      # 原始数据目录
      - ../data/raw:/app/data/raw:ro
      # 工作目录
      - ../data/work:/app/data/work
      # 配置文件
      - ../.env:/app/.env:ro
      # Qoder session 持久化（宿主机保存对话历史）
      - qoder-sessions:/root/.qoder
    env_file:
      - ../.env
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      # QODER_PERSONAL_ACCESS_TOKEN 从 .env 通过 env_file 注入
    depends_on:
      qdrant:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - biblebot-net

volumes:
  qdrant-storage:
    driver: local
  qoder-sessions:
    driver: local

networks:
  biblebot-net:
    external: true
    name: docker_default
