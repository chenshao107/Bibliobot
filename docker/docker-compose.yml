# Biblebot - Agent API 服务
# Qdrant 向量数据库 + Biblebot API 服务（OpenAI 兼容 + RAG）
# Agent Runtime: Qoder CLI（通过 QODER_PERSONAL_ACCESS_TOKEN 认证，无需预装）

version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: biblebot-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - biblebot-net

  biblebot:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
      args:
        # 代理配置（可选，国内环境可能需要）
        - HTTP_PROXY=${HTTP_PROXY:-}
        - HTTPS_PROXY=${HTTPS_PROXY:-}
        - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1,qdrant}
    container_name: biblebot-server
    # 容器文件系统只读（除显式 tmpfs/volume 外，Agent 无法修改任何代码/脚本/配置）
    read_only: true
    ports:
      - "8000:8000"
    volumes:
      # 整个 data 目录只读（Agent 不可修改知识库）
      - ../data:/app/data:ro
      # Agent 临时工作目录（tmpfs 内存盘，重启即消失）
      - type: tmpfs
        target: /app/data/work
        tmpfs:
          size: 256M
      # 通用临时目录（程序运行需要可写 /tmp）
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 64M
      # 配置文件
      - ../.env:/app/.env:ro
      # Qoder session 持久化（volume 在 read_only 容器中仍可写）
      - qoder-sessions:/root/.qoder
    env_file:
      - ../.env
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    depends_on:
      qdrant:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - biblebot-net

volumes:
  qdrant-storage:
    driver: local
  qoder-sessions:
    driver: local

networks:
  biblebot-net:
    external: true
    name: docker_default
